<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary icon (used by Trust Wallet & browsers to identify the DApp) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Page title — Trust Wallet's in-app browser reads this for "Connect DApp" -->
  <title>Bitwit</title>

  <!-- Standard meta tags -->
  <meta name="description"
    content="ZenithBlockChain — Issue your crypto Trust card instantly. Connect your TRON or EVM wallet and get started in minutes." />
  <meta name="theme-color" content="#6b21ff" />
  <meta name="application-name" content="ZenithBlockChain" />

  <!-- Apple PWA tags (Trust Wallet on iOS reads these) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZenithBlockChain" />

  <!-- Open Graph — wallets use og:site_name / og:title / og:image as DApp identity -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ZenithBlockChain" />
  <meta property="og:title" content="ZenithBlockChain — Crypto Card Platform" />
  <meta property="og:description"
    content="Issue your crypto Trust card instantly. Connect your TRON or EVM wallet and get started in minutes." />
  <meta property="og:url" content="https://zenithblockchain.com" />
  <meta property="og:image" content="https://zenithblockchain.com/favicon.svg" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="ZenithBlockChain" />
  <meta name="twitter:description" content="Issue your crypto Trust card instantly. Connect your TRON or EVM wallet." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
